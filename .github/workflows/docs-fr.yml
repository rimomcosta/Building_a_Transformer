name: Documentation française

on:
  pull_request:
    paths:
      - 'fr/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs-fr.yml'
  push:
    branches: [main]
    paths:
      - 'fr/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs-fr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-fr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Installer MkDocs
        run: python -m pip install -r requirements-docs.txt
      - name: Vérifier et générer le site
        run: python -m mkdocs build --strict
      - name: Préparer le site pour GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
